name: tests

# Déclenchement automatique désactivé temporairement (compte GitHub bloqué).
# Pour le réactiver, décommenter les lignes push/pull_request ci-dessous.
on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main
  # pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # La CI n'a pas besoin du conteneur MySQL : on force SQLite,
    # ces variables ont priorité sur celles du fichier .env.
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
